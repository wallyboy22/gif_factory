# =============================================================================
# REFERÊNCIA GERAL DE VISUALIZAÇÕES — MapBiomas Fábrica de GIFs
# =============================================================================
# legend_type: "colorbar" (gradiente contínuo) | "legenda" (classes discretas)
# classes: lista de {value, label, color}  (para legenda)
# colorbar_ticks: ticks sugeridos (para colorbar)
# band_pattern: nome genérico das bandas ({YYYY} = ano, {band} = nome da banda)
# used_by: produtos que usam esta visualização
# =============================================================================

visualization_reference:

  # ═══════════════════════════════════════════════════════════════════════════
  # FOGO
  # ═══════════════════════════════════════════════════════════════════════════

  fire:
    name: "Fogo - Binário"
    legend_type: "legenda"
    cmap_type: "binary"
    min: 0
    max: 1
    palette:
      - "fdfdfd"
      - "800000"
    label: "Pixel queimado"
    classes:
      - value: 0
        label: "Não queimado"
        color: "fdfdfd"
      - value: 1
        label: "Queimado"
        color: "800000"
    band_pattern: "{YYYY}"
    used_by:
      - dataset: brasil_fire_col3
        products:
          - id: annual_burned
            temporal: [1985, 2023]
          - id: accumulated_burned
            temporal: [1985, 2023]
          - id: time_after_fire
            temporal: null
          - id: time_before_fire
            temporal: null
      - dataset: paraguay_fire_col1
        products:
          - id: annual_burned
            temporal: [1998, 2023]
          - id: accumulated_burned
            temporal: [1998, 2023]

  monthly:
    name: "Fogo - Mês"
